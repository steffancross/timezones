name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Collapse a landed stack (back-to-back merges to main) into a single deploy of the final state.
# Each new push cancels the in-flight/queued run; cancellation lands during the long build/e2e
# phase, not the brief wrangler activation, so it's safe for deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_ID: ${{ vars.NEXT_PUBLIC_SITE_ID }}
      NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit only)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Build for Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: |
          for attempt in 1 2 3; do
            pnpm exec opennextjs-cloudflare deploy && break
            if [ $attempt -lt 3 ]; then
              echo "Deploy attempt $attempt failed, retrying in 10s..."
              sleep 10
            else
              echo "Deploy failed after $attempt attempts"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
